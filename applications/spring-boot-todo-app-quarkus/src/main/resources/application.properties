# Change port to 8081 (was server.port)
quarkus.http.port=8081
# Tests would otherwise also default to 8081; use a random port
quarkus.http.test-port=0

# MySQL datasource configuration (was spring.datasource.*)
# db-kind replaces spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
quarkus.datasource.db-kind=mysql
# Connection details only apply in prod; dev/test use Dev Services (containerized MySQL)
%prod.quarkus.datasource.jdbc.url=jdbc:mysql://127.0.0.1:3306/todo
%prod.quarkus.datasource.username=root
%prod.quarkus.datasource.password=root

# Hibernate configuration (was spring.jpa.*)
quarkus.hibernate-orm.schema-management.strategy=update
# Dev mode: recreate the schema so import.sql seeds the sample tasks (Hibernate only runs it on create)
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=true
# spring.jpa.properties.hibernate.dialect=MySQL8Dialect -> auto-detected from db-kind
# Spring Boot's default naming strategy maps camelCase to snake_case (dueDate -> due_date);
# keep it so the existing MySQL schema is reused.
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
